name: Publish

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  publish:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    # A release pushes `main` and the tag together, so two runs of this job
    # start on the same commit seconds apart. Both write the same
    # `type=gha,mode=max` cache scope, and racing on it is what left the second
    # run hanging for tens of minutes with the image already published.
    # Serialising them costs nothing: the one that waits builds against the
    # cache the first has just filled. Not `cancel-in-progress` — the two runs
    # publish different tags (`latest` from main, the version from the tag), so
    # cancelling one would drop tags nobody would notice were missing.
    concurrency:
      group: publish-${{ github.repository }}
      cancel-in-progress: false

    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/trp-labs/trptools-backend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
